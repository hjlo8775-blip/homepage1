<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>モノづくりと趣味の記録</title>
    <style>
        body { font-family: 'Helvetica Neue', Arial, sans-serif; line-height: 1.7; max-width: 900px; margin: auto; padding: 40px 20px; background: #f4f6f9; color: #333; }
        header { text-align: center; padding-bottom: 30px; margin-bottom: 40px; border-bottom: 3px solid #2c3e50; }
        h1 { margin: 0; font-size: 2.2rem; letter-spacing: 1px; color: #2c3e50; }
        header p { color: #7f8c8d; margin-top: 10px; font-size: 1.1rem; }
        h2 { border-left: 5px solid #3498db; padding-left: 12px; color: #2c3e50; font-size: 1.5rem; margin-top: 0; }
        section { background: #fff; padding: 30px; margin: 25px 0; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 25px; }
        .btn-link { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #3498db; color: #fff; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.2s; }
        .btn-link:hover { background: #2980b9; }
        @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <h1>趣味の記録</h1>
    </header>

    <div class="grid">
        <section>
            <a href="audio1.html" class="btn-link">オーディオの部屋を見る</a>
        </section>

        <section>
            <a href="#" class="btn-link" style="background: #95a5a6; cursor: not-allowed;">自動車の部屋を見る</a>
        </section>
    </div>

</body>
</html>
